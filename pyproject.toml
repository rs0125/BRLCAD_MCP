[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brlcad-mcp"
version = "0.1.0"
description = "Natural language interface for BRL-CAD solid modeling via MCP."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "BRL-CAD MCP Contributors" }]

dependencies = [
    "mcp",
    "pydantic",
    "python-dotenv",
    "pyyaml",
    "langchain>=1.0",
    "langchain-openai",
    "langchain-mcp-adapters",
    "langgraph",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]
# Model backends other than OpenAI.  Deliberately optional: an OpenAI-dialect
# endpoint (any gateway, vLLM, llama.cpp, LM Studio, Ollama's /v1 port) needs
# none of these, and a restricted site should install only what it is allowed
# to.  See docs/PROVIDERS.md.
anthropic = ["langchain-anthropic"]
google = ["langchain-google-genai"]
ollama = ["langchain-ollama"]
bedrock = ["langchain-aws"]
# Everything above, for testing across backends.
all-providers = [
    "langchain-anthropic",
    "langchain-google-genai",
    "langchain-ollama",
    "langchain-aws",
]

[project.scripts]
brlcad-mcp = "brlcad_mcp.cli:main"

[tool.hatch.build.targets.wheel]
# client_v2 is the shipping client (`brlcad-mcp chat`), so it has to be in the
# wheel alongside the server -- with its skill/prompt definition files, which are
# read from disk at runtime rather than being baked into the code.
packages = ["src/brlcad_mcp", "client_v2"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
