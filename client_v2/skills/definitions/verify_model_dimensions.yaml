id: verify_model_dimensions
version: 1
kind: tool-wrapper
description: >
  Objectively verify a built region matches its spec using BRL-CAD's own
  analysers (bb + nirt) -- NOT a render. Checks existence, bounding box, and
  that every cylindrical hole actually goes through.

io:
  inputs:
    - {name: name, type: text, required: true}
  outputs:
    - {name: verdict, type: text}

preconditions:
  - "the region has already been built by build_from_spec or edit_build, so its spec is stored"

dependencies:
  - verify_model_dimensions

steps:
  - {call: verify_model_dimensions, with: {name: "${name}"}}

cautions:
  - "Engine truth, not vision: a hole hidden by camera angle still passes, and a hole that failed to cut is caught -- unlike a render."
  - "The through-hole ray check assumes cylindrical subtracts are through-holes, not blind pockets."
  - "Pass the build NAME, not a spec. The rays and expected bbox are derived from whatever spec the tool is given, so a resent copy that drifted verifies against the wrong target instead of failing. Only pass 'spec' for a model this server did not build."

success_criteria:
  - "verdict starts with 'Verification ... : PASS'"

abort_criteria:
  - "any engine-truth check fails -> kick back to the planner to revise the spec"

recovery_actions:
  - "revise_model_spec (edit_build) then re-verify"
